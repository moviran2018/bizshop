<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title data-i18n="reservation.title">رزرو میز | نوبو</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍣</text></svg>">
</head><body>

<header><div class="header-inner">
<button class="mobile-toggle" id="mobileToggle">☰</button>
<a href="index.html" class="logo">
  <svg viewBox="0 0 200 50"><text x="0" y="35" font-family="Playfair Display, Georgia, serif" font-size="28" font-weight="400" fill="#af945c" font-style="italic">NOBU</text><text x="85" y="35" font-family="Playfair Display, Georgia, serif" font-size="28" font-weight="300" fill="#f0ece4">تهران</text></svg>
</a>
<ul class="nav" id="mainNav">
<li><a href="index.html" data-i18n="nav.home">خانه</a></li>
<li><a href="menu.html" data-i18n="nav.menu">منو</a></li>
<li><a href="reservation.html" class="active" data-i18n="nav.reservation">رزرو</a></li>
<li><a href="gallery.html" data-i18n="nav.gallery">گالری</a></li>
<li><a href="contact.html" data-i18n="nav.contact">تماس</a></li>
</ul>
<div class="header-actions">
<div class="lang-dropdown" id="langSwitcher">
<button class="lang-dropdown-toggle" onclick="this.closest('.lang-dropdown').classList.toggle('open')">🌐</button>
<div class="lang-dropdown-menu">
<button class="lang-option active" data-lang="fa" onclick="I18n.switch('fa')">🇮🇷 فارسی</button>
<button class="lang-option" data-lang="en" onclick="I18n.switch('en')">🇬🇧 English</button>
<button class="lang-option" data-lang="ar" onclick="I18n.switch('ar')">🇦🇪 العربية</button>
</div></div>
<a href="reservation.html" class="btn btn-outline-light btn-sm" data-i18n="hero.book">رزرو میز</a>
</div></div>
</header>

<section class="page-hero">
<div class="hero-content" style="position:relative;z-index:2;">
<p style="font-family:var(--font-ui);font-size:0.7rem;letter-spacing:6px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;" data-i18n="reservation.title">رزرو میز</p>
<h1 data-i18n="reservation.title">رزرو میز</h1>
<p data-i18n="reservation.desc">فرم زیر را پر کنید تا میز شما رزرو شود</p>
</div>
</section>

<section class="page-section page-section--dark page-section--padding--lg">
<div class="container" style="max-width:620px;">
<div class="reservation-form" id="reservationForm">
<form id="reservationFormEl">
<div class="form-group">
<label data-i18n="reservation.name">نام و نام خانوادگی</label>
<input type="text" id="resvName" required>
</div>
<div class="form-row">
<div class="form-group">
<label data-i18n="reservation.phone">شماره تماس</label>
<input type="tel" id="resvPhone" required dir="ltr">
</div>
<div class="form-group">
<label data-i18n="reservation.email">ایمیل</label>
<input type="email" id="resvEmail" dir="ltr">
</div>
</div>
<div class="form-row">
<div class="form-group">
<label data-i18n="reservation.date">تاریخ</label>
<input type="date" id="resvDate" required>
</div>
<div class="form-group">
<label data-i18n="reservation.time">ساعت</label>
<select id="resvTime" required>
<option value="12:00">12:00</option><option value="12:30">12:30</option>
<option value="13:00">13:00</option><option value="13:30">13:30</option>
<option value="14:00">14:00</option><option value="14:30">14:30</option>
<option value="15:00">15:00</option><option value="18:00">18:00</option>
<option value="18:30">18:30</option><option value="19:00">19:00</option>
<option value="19:30">19:30</option><option value="20:00">20:00</option>
<option value="20:30">20:30</option><option value="21:00">21:00</option>
<option value="21:30">21:30</option><option value="22:00">22:00</option>
</select>
</div>
</div>
<div class="form-group">
<label data-i18n="reservation.guests">تعداد مهمان</label>
<select id="resvGuests">
<option value="1" data-i18n="reservation.guest1">۱ نفر</option>
<option value="2" selected data-i18n="reservation.guest2">۲ نفر</option>
<option value="3" data-i18n="reservation.guest3">۳ نفر</option>
<option value="4" data-i18n="reservation.guest4">۴ نفر</option>
<option value="5" data-i18n="reservation.guest5">۵ نفر</option>
<option value="6" data-i18n="reservation.guest6">۶ نفر</option>
<option value="7" data-i18n="reservation.guestM">بیشتر از ۶ نفر</option>
</select>
</div>
<div class="form-group">
<label data-i18n="reservation.requests">درخواست ویژه</label>
<textarea id="resvRequests" data-i18n-placeholder="reservation.requestsPlace" placeholder="آلرژی، مناسبت خاص، ..."></textarea>
</div>
<button type="submit" class="btn btn-outline-primary" style="width:100%;padding:14px;">ثبت رزرو</button>
</form>
</div>
<div class="reservation-success" id="reservationSuccess">
<div class="icon">✅</div>
<h3 data-i18n="reservation.success">رزرو شما با موفقیت ثبت شد</h3>
<p data-i18n="reservation.successDesc">کد پیگیری خود را یادداشت کنید</p>
<div class="tracking-code" id="trackingCode">NOBU-XXXX</div>
<button class="btn btn-outline-light" id="newReservation" style="margin-top:16px;" data-i18n="reservation.new">رزرو جدید</button>
</div>
</div>
</section>

<footer><div class="container container--lg">
<div class="footer-bottom" data-i18n="footer.rights">© تمامی حقوق محفوظ است.</div>
</div></footer>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body></html>
