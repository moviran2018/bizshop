<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فروشگاه — LUXÉ PARFUM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="topbar"><div class="container"><span>ارسال رایگان برای سفارش بالای ۲ میلیون تومان</span><a href="admin/login.html" style="color:var(--gold)">پنل ادمین</a></div></div>
<header class="header"><div class="container"><div class="header-inner">
  <a href="index.html" class="logo">LUXÉ<span> PARFUM</span></a>
  <nav class="nav"><a href="index.html">خانه</a><a href="products.html" class="active">فروشگاه</a><a href="index.html#about">درباره ما</a></nav>
  <div class="header-actions"><button class="icon-btn" onclick="openCart()">🛒 <span class="badge" id="cartBadge" style="display:none">0</span></button></div>
</div></div></header>

<div class="container">
  <div class="breadcrumb"><a href="index.html">خانه</a> / فروشگاه</div>
  <h1 style="font-family:var(--font-en);font-size:2rem;margin-bottom:6px">همه عطرها</h1>
  <p style="color:var(--gray-500);margin-bottom:20px">کلکسیون کامل لوکس پرفیوم — فیلتر بر اساس کالکشن، جنسیت و قیمت</p>

  <div class="products-layout">
    <aside class="filters">
      <h3>فیلترها</h3>
      <button onclick="clearFilters()" style="font-size:0.75rem;color:var(--gold);background:none;border:none;cursor:pointer;margin-bottom:12px">پاک کردن فیلترها ×</button>
      <div class="filter-group"><h4>کالکشن</h4>
        <label class="filter-opt"><input type="checkbox" value="signature" class="f-collection"> سیگنچر</label>
        <label class="filter-opt"><input type="checkbox" value="floral" class="f-collection"> فلورال</label>
        <label class="filter-opt"><input type="checkbox" value="woody" class="f-collection"> وودی</label>
        <label class="filter-opt"><input type="checkbox" value="fresh" class="f-collection"> فرش</label>
        <label class="filter-opt"><input type="checkbox" value="limited" class="f-collection"> لیمیتد</label>
      </div>
      <div class="filter-group"><h4>جنسیت</h4>
        <label class="filter-opt"><input type="checkbox" value="man" class="f-gender"> مردانه</label>
        <label class="filter-opt"><input type="checkbox" value="woman" class="f-gender"> زنانه</label>
        <label class="filter-opt"><input type="checkbox" value="unisex" class="f-gender"> یونیسکس</label>
      </div>
      <div class="filter-group"><h4>قیمت</h4>
        <label class="filter-opt"><input type="radio" name="price" value="" class="f-price" checked> همه</label>
        <label class="filter-opt"><input type="radio" name="price" value="0-4000000" class="f-price"> زیر ۴ میلیون</label>
        <label class="filter-opt"><input type="radio" name="price" value="4000000-6000000" class="f-price"> ۴ تا ۶ میلیون</label>
        <label class="filter-opt"><input type="radio" name="price" value="6000000-99999999" class="f-price"> بالای ۶ میلیون</label>
      </div>
      <div class="filter-group"><h4>مرتب‌سازی</h4>
        <select id="sortSelect" style="width:100%;padding:10px;border:1px solid var(--beige);border-radius:8px;font-family:inherit">
          <option value="default">پیش‌فرض</option>
          <option value="price-asc">ارزان‌ترین</option>
          <option value="price-desc">گران‌ترین</option>
          <option value="newest">جدیدترین</option>
        </select>
      </div>
    </aside>

    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <span id="resultCount" style="color:var(--gray-500);font-size:0.85rem"></span>
        <input id="qInput" placeholder="جستجو..." style="padding:10px 14px;border:1px solid var(--beige);border-radius:999px;font-family:inherit;min-width:220px">
      </div>
      <div class="grid" id="productsGrid" style="grid-template-columns:repeat(3,1fr)"></div>
      <div id="empty" style="display:none;text-align:center;padding:60px;color:var(--gray-500)">محصولی یافت نشد</div>
    </div>
  </div>
</div>

<footer class="footer"><div class="container"><div class="footer-bottom"><span>© لوکس پرفیوم</span><span>LUXÉ PARFUM</span></div></div></footer>

<div class="cart-drawer" id="cartDrawer"><div class="cart-overlay" onclick="closeCart()"></div><div class="cart-panel"><div class="cart-head"><strong>سبد خرید</strong><button onclick="closeCart()" style="background:none;border:none;font-size:1.4rem;cursor:pointer">×</button></div><div class="cart-body" id="cartBody"></div><div class="cart-foot"><div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:14px"><span>جمع کل</span><span id="cartTotal">۰</span></div><button class="btn btn-dark" style="width:100%;justify-content:center" onclick="checkout()">تسویه حساب</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
let all=[];
async function init(){
  all=await Store.getProducts();
  applyFilters();
  // url params
  const p=new URLSearchParams(location.search);
  if(p.get('collection')) document.querySelectorAll('.f-collection').forEach(c=>{ if(c.value===p.get('collection')) c.checked=true });
  if(p.get('q')) document.getElementById('qInput').value=p.get('q');
  document.querySelectorAll('.f-collection,.f-gender,.f-price').forEach(el=>el.addEventListener('change',applyFilters));
  document.getElementById('sortSelect').addEventListener('change',applyFilters);
  document.getElementById('qInput').addEventListener('input',applyFilters);
}
function applyFilters(){
  const cols=[...document.querySelectorAll('.f-collection:checked')].map(i=>i.value);
  const genders=[...document.querySelectorAll('.f-gender:checked')].map(i=>i.value);
  const price=document.querySelector('.f-price:checked')?.value||'';
  const q=(document.getElementById('qInput')?.value||'').toLowerCase();
  const sort=document.getElementById('sortSelect')?.value||'default';
  let list=[...all];
  if(cols.length) list=list.filter(p=>cols.includes(p.category));
  if(genders.length) list=list.filter(p=>genders.includes(p.gender));
  if(price){ const [min,max]=price.split('-').map(Number); list=list.filter(p=>p.price>=min && p.price<=max); }
  if(q) list=list.filter(p=> (p.title+p.subtitle+p.description).toLowerCase().includes(q));
  if(sort==='price-asc') list.sort((a,b)=>a.price-b.price);
  if(sort==='price-desc') list.sort((a,b)=>b.price-a.price);
  if(sort==='newest') list.sort((a,b)=> (b.is_new?1:0)-(a.is_new?1:0));
  const grid=document.getElementById('productsGrid');
  const empty=document.getElementById('empty');
  const count=document.getElementById('resultCount');
  count.textContent=list.length+' محصول';
  if(!list.length){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML=list.map(p=>cardHTML(p)).join('');
}
function clearFilters(){ document.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false); document.querySelectorAll('input[type=radio]')[0].checked=true; document.getElementById('qInput').value=''; document.getElementById('sortSelect').value='default'; applyFilters(); }
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
